<!DOCTYPE html>
<html>
<head>
  <title>Arduino Controller</title>
</head>
<body>

<h2>Start Arduino</h2>

<button id="speelKnop">Speel</button>

<script>
  
document.getElementById("speelKnop").addEventListener("click", function() {

  fetch("http://192.168.178.97:8080/start", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
  "notes": ["C4", "E4", "G4"],
  "tempo": 120
})
  })
  .then(response => response.text())
  .then(data => console.log("Server zegt:", data))
  .catch(error => console.error("Fout:", error));

});
</script>

</body>
</html>
